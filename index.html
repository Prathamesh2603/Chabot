<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="root"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
        function ChatInput({chatMessages, setChatMessages}) {   
            const [inputText, setInputText] = React.useState(""); // initial value is empty

            function saveInputText(e) {
                setInputText(e.target.value);  // Taking value and saving it in inputText
            }

            function sendMessage() {
                setChatMessages([     
                    ...chatMessages,   
                    {                  
                        message: inputText,  // which contains input value
                        sender: "user",
                        id: crypto.randomUUID()  
                    }
                ]);

                setInputText("");  // It will empty the state(input) 
            }

            return (   
                <> 
                    <input 
                        placeholder = "Send message to chatbot" 
                        size = "30"
                        onChange = {saveInputText} // if there any changes in input saveInputText func runs.
                        value = {inputText}
                    /> 
                    <button
                        onClick={sendMessage}
                    >Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) { 
            return (
                <div>
                    {sender === "robot" && (
                        <img src="robot.jpg" alt="robot" height = "50" />
                    )} {/* sender is robot */}
                    {message}
                    {sender === "user" && (
                        <img src="user.jpg" alt="user" height = "50" />
                    )}  {/* sender is user */} 
                </div>
            );
        }

        function ChatMessages({chatMessages}) {      
            return (
                <>
                    {chatMessages.map((chatMessage) => {  
                        return (
                            <ChatMessage 
                                message = {chatMessage.message} 
                                sender = {chatMessage.sender}
                                key = {chatMessage.id} 
                            />
                        );
                    })}
                </>
            );
        }

        // App component is a parent of ChatInput & ChatMessages component, now it can share data(two return values) to both component using props.
        const App = () => { 
            // Lifting the state up technique
            const [chatMessages, setChatMessages] = React.useState([        // Initial values
                {
                    message: "hello chatbot",
                    sender: "user",
                    id: "id1"
                },
                {
                    message: "Hello! how can i help you",
                    sender: "robot",
                    id: "id2"
                }
            ]);

            return (
                <> 
                    <ChatInput 
                        chatMessages={chatMessages} 
                        setChatMessages={setChatMessages} 
                    />
                    <ChatMessages
                        chatMessages={chatMessages} 
                    />
                </>
            );
        }

        ReactDOM.createRoot(document.querySelector(".root")).render(
            <App />     
        );            
    </script>
  </body>
</html>
