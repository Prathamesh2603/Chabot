<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="root"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    
    <!-- Loading another library for a response from chatbot -->
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>


    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
        function ChatInput({chatMessages, setChatMessages}) {   
            const [inputText, setInputText] = React.useState(""); 

            function saveInputText(e) {
                setInputText(e.target.value);  
            }

            // Problem:- User text is not displayed only chatbot's did. why?
            // Answer:- In react state is not updated immediately. It's updated after all the code is finished.
            function sendMessage() {
                // So, here the chatMessages is not updated immediately...
                setChatMessages([    // with this new array      
                    ...chatMessages,   
                    {   // users new chatmessage
                        message: inputText,  
                        sender: "user",
                        id: crypto.randomUUID()  
                    }
                ]);

                setInputText("");  

                const response = Chatbot.getResponse(inputText);
                setChatMessages([     
                    ...chatMessages,  // When it reaches here, chatMessage is still the old array without the users new input.
                    {   // so old array with this new chatbot response is added to the inputText state & user's chatmessage is lost.              
                        message: response,  
                        sender: "robot",
                        id: crypto.randomUUID()  
                    }
                ]);  // Code finishes here
            }

            return (   
                <> 
                    <input 
                        placeholder = "Send message to chatbot" 
                        size = "30"
                        onChange = {saveInputText} 
                        value = {inputText}
                    /> 
                    <button
                        onClick={sendMessage}
                    >Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) { 
            return (
                <div>
                    {sender === "robot" && (
                        <img src="robot.jpg" alt="robot" height = "50" />
                    )} {/* sender is robot */}
                    {message}
                    {sender === "user" && (
                        <img src="user.jpg" alt="user" height = "50" />
                    )}  {/* sender is user */} 
                </div>
            );
        }

        function ChatMessages({chatMessages}) {      
            return (
                <>
                    {chatMessages.map((chatMessage) => {  
                        return (
                            <ChatMessage 
                                message = {chatMessage.message} 
                                sender = {chatMessage.sender}
                                key = {chatMessage.id} 
                            />
                        );
                    })}
                </>
            );
        }

        
        const App = () => {             
            const [chatMessages, setChatMessages] = React.useState([        
                {
                    message: "hello chatbot",
                    sender: "user",
                    id: "id1"
                },
                {
                    message: "Hello! how can i help you",
                    sender: "robot",
                    id: "id2"
                }
            ]);

            return (
                <> 
                    <ChatInput 
                        chatMessages={chatMessages} 
                        setChatMessages={setChatMessages} 
                    />
                    <ChatMessages
                        chatMessages={chatMessages} 
                    />
                </>
            );
        }

        ReactDOM.createRoot(document.querySelector(".root")).render(
            <App />     
        );            
    </script>
  </body>
</html>
