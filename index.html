<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="root"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
        function ChatInput() {
            return (   
                <div>  {/* Wrapping input and button, since return only returns one element(thing)*/}
                    <input /> {/*shortcut: <input></input>*/}
                    <button>Send</button>
                </div>
            );
        }

        ReactDOM.createRoot(document.querySelector(".root")).render(<ChatInput />);
    </script>
  </body>
</html>
