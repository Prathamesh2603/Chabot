<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="root"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
        function ChatInput() {    
            return (   
                <> 
                    <input /> 
                    <button>Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) { //shortcut of shortcut
            //const message = props.message;
            //const sender = props.sender;
            //shortcut of these two lines:
            // const { message, sender } = props; 

            if (sender === "robot") {
                return (
                    <div>
                        <img src="robot.jpg" alt="robot" height = "50" />
                        {message}
                    </div>
                );
            }

            return (
                <div>
                    {message}
                    <img src="user.jpg" alt="user" height = "50" />
                </div>
            );
        }

        const App = () => {
            return (
                <> 
                    <ChatInput />
                    <ChatMessage message = "hello chatbot" sender="user"/>
                    <ChatMessage message = "Hello! how can i help you" sender="robot"/>
                </>
            );
        }

        ReactDOM.createRoot(document.querySelector(".root")).render(
            <App />     
        );            
    </script>
  </body>
</html>
