<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
        .send-button {
            background-color: rgb(25, 135, 84);
            color: white;
            padding: 12px 20px;
            margin-left: 10px;
            font-size: 16px;
            border: none;
            outline: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
  </head>
  <body>
    <div class="root"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    
    <!-- Loading another library for a response from chatbot -->
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>


    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
        function ChatInput({chatMessages, setChatMessages}) {   
            const [inputText, setInputText] = React.useState(""); 

            function saveInputText(e) {
                setInputText(e.target.value);  
            }

            function sendMessage() {
                // Solution:-
                const newChatMessages = [  // Saving old msg array & new user's msg in variable
                    ...chatMessages,   // Old Array
                    {   
                        message: inputText,  // User's Message
                        sender: "user",
                        id: crypto.randomUUID()  
                    }
                ]

                setChatMessages(newChatMessages); // setting chatMessages with new var.

                setInputText("");  

                const response = Chatbot.getResponse(inputText);
                setChatMessages([     
                    ...newChatMessages,  // Instead of adding old array, new var is added which contains user's chat msg
                    {                
                        message: response,  // To that it will add the chatbot response
                        sender: "robot",
                        id: crypto.randomUUID()  
                    }
                ]); 
            }

            return (   
                <> 
                    <input 
                        placeholder = "Send message to chatbot" 
                        size = "30"
                        onChange = {saveInputText} 
                        value = {inputText}
                    /> 
                    <button
                        className="send-button"
                        onClick={sendMessage}
                    >Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) { 
            return (
                <div>
                    {sender === "robot" && (
                        <img src="robot.jpg" alt="robot" height = "50" />
                    )} {/* sender is robot */}
                    {message}
                    {sender === "user" && (
                        <img src="user.jpg" alt="user" height = "50" />
                    )}  {/* sender is user */} 
                </div>
            );
        }

        function ChatMessages({chatMessages}) {      
            return (
                <>
                    {chatMessages.map((chatMessage) => {  
                        return (
                            <ChatMessage 
                                message = {chatMessage.message} 
                                sender = {chatMessage.sender}
                                key = {chatMessage.id} 
                            />
                        );
                    })}
                </>
            );
        }

        
        const App = () => {             
            const [chatMessages, setChatMessages] = React.useState([        
                {
                    message: "hello chatbot",
                    sender: "user",
                    id: "id1"
                },
                {
                    message: "Hello! how can i help you",
                    sender: "robot",
                    id: "id2"
                }
            ]);

            return (
                <> 
                    <ChatInput 
                        chatMessages={chatMessages} 
                        setChatMessages={setChatMessages} 
                    />
                    <ChatMessages
                        chatMessages={chatMessages} 
                    />
                </>
            );
        }

        ReactDOM.createRoot(document.querySelector(".root")).render(
            <App />     
        );            
    </script>
  </body>
</html>
