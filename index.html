<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="root"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
        function ChatInput() {   //Pascal Case: words first letter is capital. 
            return (   
                <> 
                    <input /> 
                    <button>Send</button>
                </>
            );
        }

        function ChatMessage() {
            return (
                <div>
                    hello chatbot
                    <img src="user.jpg" alt="user" height = "50" />
                </div>
            );
        }

        const App = () => {
            return (
                <> 
                    <ChatInput />
                    <ChatMessage />
                </>
            );
        }

        ReactDOM.createRoot(document.querySelector(".root")).render(
            <App />   // shortcut: React Method(<App></App>).  
        );            // JS method: App() to call a function.
    </script>
  </body>
</html>
