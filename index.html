<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="root"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      
        function ChatInput() {    
            return (   
                <> 
                    <input 
                        placeholder="Send message to chatbot" 
                        size="30"
                    /> 
                    <button>Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) { 
            return (
                <div>
                    {sender === "robot" && (
                        <img src="robot.jpg" alt="robot" height = "50" />
                    )} {/* sender is robot */}
                    {message}
                    {sender === "user" && (
                        <img src="user.jpg" alt="user" height = "50" />
                    )}  {/* sender is user */} 
                </div>
            );
        }

        function ChatMessages() {
            // useState function returns an array of two values
            const array = React.useState([        // Initial values
                {
                    message: "hello chatbot",
                    sender: "user",
                    id: "id1"
                },
                {
                    message: "Hello! how can i help you",
                    sender: "robot",
                    id: "id2"
                }
            ]);
            const chatMessages = array[0]; // 1. Current Value
            const setChatMessages = array[1]  // 2. Updater function

            function sendMessages() {   
                // Updater func regenerates the HTML
                setChatMessages([      // Updater function replacing the chatMessages with this new array
                    ...chatMessages,   // Copy of initial value
                    {                  // Adding New value
                        message: "What is today date",
                        sender: "user",
                        id: crypto.randomUUID()  
                    }
                ]);
            }        

            return (
                <>
                    <button onClick={sendMessages}>Send Messages</button>
                    {chatMessages.map((chatMessage) => {  // basically updater func will re-run this whole code and update the website
                        return (
                            <ChatMessage 
                                message = {chatMessage.message} 
                                sender = {chatMessage.sender}
                                key = {chatMessage.id} 
                            />
                        );
                    })}
                </>
            );
        }

        const App = () => {
            return (
                <> 
                    <ChatInput />
                    <ChatMessages />
                </>
            );
        }

        ReactDOM.createRoot(document.querySelector(".root")).render(
            <App />     
        );            
    </script>
  </body>
</html>
